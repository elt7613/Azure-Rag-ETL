<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure RAG ETL</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #6aa3ff; --warn: #f0b429; --good: #4ec9a5;
    --bad: #f2777a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #ffffff; --line: #e3e6ec; --text: #14171f;
      --muted: #61697d; --accent: #2563eb; --warn: #b7791f; --good: #0f8f6f;
      --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  select, input, button, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .turn { max-width: 860px; width: 100%; align-self: center; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 5px; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; white-space: pre-wrap; }
  .user .bubble { background: transparent; border-style: dashed; }
  .badges { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.good { color: var(--good); border-color: currentColor; }
  .badge.warn { color: var(--warn); border-color: currentColor; }
  .badge.bad  { color: var(--bad);  border-color: currentColor; }
  .cites { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .cite { font-size: 12.5px; color: var(--muted); }
  .cite b { color: var(--text); font-weight: 600; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre { overflow-x: auto; font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0 0; }
  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  .composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  .hint code { cursor: pointer; border-bottom: 1px dotted var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Azure RAG ETL</h1>
  <label style="font-size:12.5px;color:var(--muted)">Department scope
    <select id="scope" multiple size="1" style="min-width:190px"></select>
  </label>
  <div class="spacer"></div>
  <button id="reset">New conversation</button>
</header>

<div id="log"></div>

<footer>
  <div class="composer">
    <textarea id="q" placeholder="Ask a question about your documents…" autofocus></textarea>
    <button class="primary" id="send">Ask</button>
  </div>
  <div class="hint">
    Try:
    <code>How many days of paid sick leave do employees get?</code> ·
    <code>What is the current Business tier price per seat?</code> ·
    <code>What is the limit?</code> ·
    <code>What is the refund policy?</code>
  </div>
</footer>

<script>
const log = document.getElementById('log');
const box = document.getElementById('q');
const send = document.getElementById('send');
const scopeSel = document.getElementById('scope');
let conversationId = null;
let history = [];

fetch('/departments').then(r => r.json()).then(d => {
  scopeSel.size = Math.min(5, d.departments.length);
  for (const dept of d.departments) {
    const opt = document.createElement('option');
    opt.value = dept.name; opt.textContent = dept.name; opt.selected = true;
    scopeSel.append(opt);
  }
});

document.querySelectorAll('.hint code').forEach(c => {
  c.onclick = () => { box.value = c.textContent; box.focus(); };
});

document.getElementById('reset').onclick = () => {
  conversationId = null; history = []; log.innerHTML = '';
};

function turn(who, cls) {
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + cls;
  wrap.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  log.append(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap.querySelector('.bubble');
}

function badge(text, kind) {
  return `<span class="badge ${kind || ''}">${text}</span>`;
}

function render(bubble, data) {
  bubble.textContent = data.answer;

  const d = data.diagnostics || {};
  const badges = [];
  if (data.cached) badges.push(badge('cached'));
  if (d.plan_kind) badges.push(badge(d.plan_kind.toLowerCase().replace('_', ' ')));
  if (data.abstained) badges.push(badge('abstained', 'warn'));
  if (data.clarification) badges.push(badge('needs clarification', 'warn'));
  if (typeof d.groundedness === 'number') {
    badges.push(badge(`groundedness ${(d.groundedness * 100).toFixed(0)}%`,
                      d.groundedness >= 0.8 ? 'good' : 'bad'));
  }
  if (d.claims_contradicted > 0) badges.push(badge(`${d.claims_contradicted} contradicted`, 'bad'));
  if (typeof data.confidence === 'number' && data.answered) {
    badges.push(badge(`confidence ${(data.confidence * 100).toFixed(0)}%`));
  }
  if (d.version_conflicts && d.version_conflicts.length) {
    badges.push(badge('version conflict resolved', 'warn'));
  }
  if (d.total_ms) badges.push(badge(`${(d.total_ms / 1000).toFixed(1)}s`));

  const parts = [];
  if (badges.length) parts.push(`<div class="badges">${badges.join('')}</div>`);

  if (data.citations && data.citations.length) {
    const cites = data.citations.map(c =>
      `<div class="cite">[${c.marker}] <b>${c.doc_id}</b>${c.section ? ' — ' + c.section : ''}` +
      `${c.page ? ', p.' + c.page : ''}${c.version ? ' (v' + c.version + ')' : ''}` +
      `${c.is_current === false ? ' <span class="badge warn">superseded</span>' : ''}</div>`
    ).join('');
    parts.push(`<div class="cites">${cites}</div>`);
  }

  parts.push(`<details><summary>Why this answer</summary><pre>${
    JSON.stringify(d, null, 2).replace(/</g, '&lt;')}</pre></details>`);

  bubble.insertAdjacentHTML('beforeend', parts.join(''));
  log.scrollTop = log.scrollHeight;
}

async function ask() {
  const message = box.value.trim();
  if (!message) return;
  box.value = '';
  send.disabled = true;

  turn('You', 'user').textContent = message;
  const bubble = turn('Assistant', 'bot');
  bubble.textContent = 'Searching the knowledge base…';

  const departments = [...scopeSel.selectedOptions].map(o => o.value);

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'X-User-Departments': departments.join(',') },
      body: JSON.stringify({ message, conversation_id: conversationId, history }),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      bubble.textContent = `${res.status}: ${detail.detail || res.statusText}`;
      return;
    }
    const data = await res.json();
    conversationId = data.conversation_id;
    history.push({ role: 'user', content: message },
                 { role: 'assistant', content: data.answer });
    render(bubble, data);
  } catch (err) {
    bubble.textContent = 'Request failed: ' + err;
  } finally {
    send.disabled = false;
    box.focus();
  }
}

send.onclick = ask;
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
</script>
</body>
</html>
